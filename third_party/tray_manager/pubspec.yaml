name: tray_manager
description: This plugin allows Flutter desktop apps to defines system tray.
version: 0.2.4
publish_to: 'none'
homepage: https://github.com/leanflutter/tray_manager

platforms:
  windows:

topics:
  - tray
  - tray-manager
  - system-tray

environment:
  # 与主工程 / menu_base 对齐到同一套 SDK 区间，避免三份 pubspec 各说各话。
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  menu_base:
    path: ../menu_base
  path: ^1.8.0
  shortid: ^0.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  mostly_reasonable_lints: ^0.1.2

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: TrayManagerPlugin
