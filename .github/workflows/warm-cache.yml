name: Warm CI Cache

# 为什么需要这个文件
# ---------------------------------------------------------------------------
# build-windows.yml 是靠推送 v* 标签触发的，而 GitHub Actions 的缓存**按 ref 隔离**：
# 一个标签构建存下的缓存，下一个标签构建看不到。于是每次发版都要
#   1) 重新下载并解压 1.79 GB 的 Flutter SDK（Setup Flutter 实测 80~138s）
#   2) 结束时再上传一次 1.79 GB（Post Setup Flutter 17~29s）
# 第 2 步传上去的缓存永远不会被用到 —— 纯浪费。
# 日志里的铁证（key 完全相同却 Cache not found）：
#   Cache not found for input keys: flutter-windows-stable-3.47.4-x64-9584c671…
#   Cache saved with key:           flutter-windows-stable-3.47.4-x64-9584c671…
#
# 解决办法：在**默认分支 main** 上跑一遍「只装依赖、不打包」的任务，把 Flutter SDK、
# pub 包、Go 模块与构建缓存写进 main 作用域。默认分支的缓存对所有分支和标签可见，
# 之后 tag 构建就能命中。
#
# 触发时机：依赖或工作流文件变化时；另外每天跑一次保活 ——
# GitHub 会清理超过 7 天未被访问的缓存，一周一次间隔太长，
# 万一发版正好落在清理前后就会掉回冷启动。

on:
  push:
    branches: [main]
    paths:
      - pubspec.yaml
      - pubspec.lock
      - third_party/x-tunnel/go.mod
      - third_party/x-tunnel/go.sum
      - .github/workflows/build-windows.yml
      - .github/workflows/warm-cache.yml
  schedule:
    # 每天 03:00 UTC。不只是为了「预热」，更是为了保活：
    # GitHub 会清理超过 7 天未被访问的缓存，一周一次间隔太长，
    # 万一发版正好落在清理前后就会掉回冷启动。本仓库是 Public（分钟数不限），
    # 每天一次的开销可以接受。
    - cron: '0 3 * * *'
  workflow_dispatch:

# 防止两次预热重叠：同时保存同一个 key 会有一方失败（缓存已存在），
# 虽然无害但会留下误导性的报错。排队即可，后到的直接取消。
concurrency:
  group: warm-cache
  cancel-in-progress: true

jobs:
  warm:
    runs-on: windows-latest
    permissions:
      # 删缓存走 gh api，没有 actions:write 会 403。而该步骤带 continue-on-error，
      # 失败只是静默跳过 —— 看起来像「没有需要清理的缓存」，实际一条都没删。
      actions: write
    steps:
      - uses: actions/checkout@v5

      # 清掉 tag 构建留下的死缓存：它们存在各自的 tag 作用域里，
      # 永远读不到，却会占满 10 GB 配额并挤掉 main 作用域的预热缓存。
      # 想立刻回收空间，直接在 Actions 页面手动 Run workflow 即可。
      # 放在开头：缓存是在所有步骤之后的 post 阶段保存的。
      - name: 清理 tag 作用域缓存
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $resp = gh api "repos/$env:GITHUB_REPOSITORY/actions/caches?per_page=100" 2>&1
          # 别静默：以前用 --jq 直接取 id，403 时管道拿到空串，
          # 于是走进「没有需要清理的缓存」分支，一条没删还以为清理成功了。
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "列出缓存失败（多半是缺少 actions:write 权限）：$resp"
            exit 0
          }
          $all = ($resp | ConvertFrom-Json).actions_caches
          Write-Output ("清理前：{0} 条 / {1:N2} GB" -f $all.Count, (($all | Measure-Object -Property size_in_bytes -Sum).Sum / 1GB))
          $dead = @($all | Where-Object { $_.ref -ne 'refs/heads/main' })
          if ($dead.Count -eq 0) { Write-Output '没有需要清理的缓存'; exit 0 }
          $n = 0; $freed = 0
          foreach ($c in $dead) {
            Write-Output "  - 删除 [$($c.ref)] $($c.key)  $([math]::Round($c.size_in_bytes / 1GB, 2)) GB"
            gh api -X DELETE "/repos/$env:GITHUB_REPOSITORY/actions/caches/$($c.id)" | Out-Null
            if ($LASTEXITCODE -eq 0) { $n++; $freed += $c.size_in_bytes }
          }
          Write-Output ("已清理 {0}/{1} 条非 main 作用域缓存，回收 {2:N2} GB" -f $n, $dead.Count, ($freed / 1GB))

      # 配置必须与 build-windows.yml **完全一致**（channel / cache / 版本来源），
      # 否则生成的缓存 key 不同，预热等于白做。
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 必须与 build-windows.yml 的 flutter-version **一字不差**：
          # 版本号是缓存 key 的一部分，两边不一致就各存各的，预热白做。
          # 升级 Flutter 时记得同时改这两个文件。
          flutter-version: '3.47.4'
          cache: true

      - name: 预热 pub 包缓存
        run: flutter pub get

      # 桌面端引擎产物也放进缓存，避免 tag 构建再下一次。
      # 预热失败不影响发版流程，所以允许失败。
      - name: 预热 Windows 桌面端引擎产物
        continue-on-error: true
        run: flutter config --enable-windows-desktop

      - name: Setup Go (内核)
        uses: actions/setup-go@v6
        with:
          go-version-file: third_party/x-tunnel/go.mod
          cache-dependency-path: third_party/x-tunnel/go.sum

      # 预热模块缓存（GOMODCACHE）与构建缓存（GOCACHE），
      # 这样 tag 构建编译内核时不必重新拉依赖、重新编译标准库。
      - name: 预热 Go 模块与构建缓存
        working-directory: third_party/x-tunnel
        run: |
          go mod download
          go build ./...

      # 本工作流只是「顺手清自己」，所以删除失败不该让预热变红；
      # 但也不能像以前那样静默——403 时得在日志里看得见。
      - name: 清理历史工作流记录（最多保留 2 条）
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $resp = gh run list --workflow ([IO.Path]::GetFileName('${{ github.workflow_ref }}'.Split('@')[0])) --limit 50 --json databaseId,status 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "列出运行记录失败（多半是缺少 actions:write 权限）：$resp"
            exit 0
          }
          # status=completed 表示「已结束」（含成功/失败/取消）；本次运行不在其中，CI 无法删自己。
          $ids = @(($resp | ConvertFrom-Json) | Where-Object { $_.status -eq 'completed' } | Select-Object -ExpandProperty databaseId)
          if ($ids.Count -gt 1) { $drop = $ids[1..($ids.Count - 1)] } else { $drop = @() }
          foreach ($id in $drop) {
            Write-Output "deleting finished run $id"
            gh api -X DELETE "/repos/$env:GITHUB_REPOSITORY/actions/runs/$id" | Out-Null
          }
          Write-Output "done: 保留本次运行 + 最新完成 $($ids.Count - $drop.Count) 条"
          exit 0
