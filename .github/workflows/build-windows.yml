name: Build Windows

on:
  workflow_dispatch:          # 手动触发（Actions 页面按钮）
    inputs:
      app_version:            # 手动打包时给版本号；打 v* 标签推送时自动取标签名
        description: 手动打包版本号（如 v1.0.0；打标签推送时忽略）
        required: false
        type: string
      publish_release:        # 手动打包后是否同时发布 GitHub Release（需填版本号）
        description: 手动打包后是否同时发布 Release
        required: false
        type: boolean
        default: false
  push:
    tags: ['v*']              # 打 v* 标签自动触发（自动发布 Release）

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      # 末尾「清理历史工作流记录」用 gh api 删除旧 run，需要 actions:write。
      # 只给 contents:write 时该步骤会 403，且因 if: always() 会把整个 job 拖红。
      actions: write
    env:
      # 版本：推送标签 → 标签名；手动 → 填的版本号；否则 dev，避免空名
      # 用 github.event.inputs 而非 inputs：push 事件下 inputs 上下文不可用，
      # 直接引用会有 Unrecognized named-value 风险；event.inputs 在 push 下为空串，安全回退。
      APP_VERSION: ${{ github.event_name == 'push' && github.ref_name || (github.event.inputs.app_version != '' && github.event.inputs.app_version || 'dev') }}
    steps:
      - uses: actions/checkout@v5

      # 关于缓存：本工作流只在打 v* 标签或手动触发时才跑。
      # GitHub 的缓存**按 ref 隔离**——一次 tag 构建存下的缓存只有这个 tag 自己能读，
      # 下个版本必然读不到（实测同一个 key 会同时出现 "Cache not found" 和
      # "Cache saved"，就是各存各的）。既然读不到，缓存就只剩坏处：结束前还要
      # 上传 1.8 GB 白占 10 GB 配额，逼得 GitHub 按 LRU 回收别的东西。
      # 所以这里一律关闭缓存：代价是每次发版重新下载 SDK（约 80~140s），
      # 换来不发版时零消耗、零配额占用，也不再有后台常驻任务。
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 锁死版本，别跟着 stable 漂：同一 SDK 才能解析出同一套依赖，
          # 发版产物才可复现（否则哪天 stable 一升，依赖和产物都跟着变）。
          flutter-version: '3.47.4'
          cache: false

      - name: Setup Go (内核)
        if: hashFiles('third_party/x-tunnel/go.mod') != ''
        uses: actions/setup-go@v6
        with:
          go-version-file: third_party/x-tunnel/go.mod
          cache: false

      # 这里不该出现 "> meta 1.19.0 (was 1.18.0)" 之类的升级输出：仓库里的
      # pubspec.lock 已经是 1.19.0 / 2.4.2，pub get 应当原样接受、零改动。
      # 若日志又冒出 "Changed 2 dependencies!"，说明有人用 Flutter 3.44.x 本地
      # 跑过 pub get 并把 lock 改回去了（原因见下），把 lock 恢复即可。
      #
      # 为什么必须和本地同版本：meta / vector_math 由 **Flutter SDK 自己**声明，
      #   Flutter 3.47.4 → packages/flutter/pubspec.yaml 写的是 ^1.18.3 / ^2.4.0（范围）
      #   Flutter 3.44.9 → 写的是 1.18.0 / 2.2.0（精确钉死，pub 没有选择余地）
      # 所以 3.44.9 一定解析出 1.18.0 / 2.2.0，和本工作流的 3.47.4 不可能共用一份 lock。
      # 注意这与 Dart SDK 版本**无关**：meta 1.19.0 只要 Dart ^3.5.0、vector_math 2.4.2
      # 只要 ^3.10.0，Dart 3.12.2 全都满足——是精确钉死挡住了，不是版本不够。
      # 因此本地也统一到 3.47.4（见 README「本地构建」），flutter-version 已锁定
      # → 每次同一 SDK 解析 → 产物可复现。
      - run: flutter pub get
      # 更新源随仓库自动走（Fork 用 github.repository 指向自己的仓库）。
      # 版本号同步注入三处，缺一会导致自动更新静默失效（详见 app_version.dart 注释）：
      #   1) ECHOS_VERSION → 应用自报版本（Updater 判定用）
      #   2) --build-name  → exe 资源里的产品版本（用于「应用和功能」显示）
      #   3) ISCC /DAPP_VERSION → 安装包文件名（下面打包步骤用 $env:APP_VERSION）
      # 标签形如 v1.2.3，这里剥掉前导 v；手动触发填了非语义化值时跳过注入，
      # 应用回退到 app_version.dart 的 defaultValue，不至于让构建失败。
      - name: 构建 Flutter Windows（注入版本）
        shell: pwsh
        run: |
          # 只取 x.y.z 主体：标签若带 +build / -rc 等后缀，--build-name 不接受，会直接构建失败
          $num = ''
          if ($env:APP_VERSION -match '^v?(\d+\.\d+\.\d+)(?:[+-].*)?$') { $num = $Matches[1] }
          if ($num -eq '') {
            Write-Host "APP_VERSION='$env:APP_VERSION' 非 x.y.z 语义化版本，跳过版本注入"
          } else {
            Write-Host "注入版本 $num"
          }
          $args = @('build', 'windows', '--release',
                    "--dart-define=ECHOS_REPO=${{ github.repository }}")
          if ($num -ne '') {
            $args += "--dart-define=ECHOS_VERSION=$num"
            $args += "--build-name=$num"
          }
          flutter @args

      - name: 准备内核 x-tunnel.exe
        shell: pwsh
        run: |
          $rel = 'build/windows/x64/runner/Release'
          if (Test-Path 'third_party/x-tunnel/go.mod') {
            # 从源码构建（仓库内可复现）
            pushd 'third_party/x-tunnel'
            go build -trimpath -buildvcs=false -ldflags="-s -w -buildid=" -o x-tunnel.exe .
            popd
            Copy-Item 'third_party/x-tunnel/x-tunnel.exe' "$rel/x-tunnel.exe" -Force
          } elseif (Test-Path 'windows/bundle/x-tunnel.exe') {
            # 直接使用仓库携带的二进制
            Copy-Item 'windows/bundle/x-tunnel.exe' "$rel/x-tunnel.exe" -Force
          } else {
            Write-Error '未找到内核二进制或源码'
            exit 1
          }

      - name: 下载 geo 数据（分流必需，打包时下载不入仓库）
        shell: pwsh
        run: |
          $rel = 'build/windows/x64/runner/Release'
          Invoke-WebRequest 'https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat' -OutFile "$rel/geoip.dat"
          Invoke-WebRequest 'https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat' -OutFile "$rel/geosite.dat"

      # wintun.dll：TUN 模式的硬依赖。内核用
      # LoadLibraryEx("wintun.dll", …, LOAD_LIBRARY_SEARCH_APPLICATION_DIR
      # | LOAD_LIBRARY_SEARCH_SYSTEM32) 加载，只认「与 x-tunnel.exe 同目录」，
      # 放别处等于没有 —— 所以必须随包发，否则用户打开 TUN 开关只会看到
      # 「加载 wintun.dll 失败」。版本与 build_local.ps1 里的常量保持一致。
      - name: 下载 wintun.dll（TUN 模式必需）
        shell: pwsh
        run: |
          $rel = 'build/windows/x64/runner/Release'
          $wintunVersion = '0.14.1'
          $zip = "$env:TEMP\wintun.zip"
          $xdir = "$env:TEMP\wintun"
          Invoke-WebRequest "https://www.wintun.net/builds/wintun-$wintunVersion.zip" -OutFile $zip
          if (Test-Path $xdir) { Remove-Item -LiteralPath $xdir -Recurse -Force }
          Expand-Archive -LiteralPath $zip -DestinationPath $xdir -Force
          $src = Join-Path $xdir 'wintun\bin\amd64\wintun.dll'
          if (-not (Test-Path $src)) { Write-Error "wintun 包里找不到 $src"; exit 1 }
          Copy-Item $src "$rel/wintun.dll" -Force
          Write-Output ("wintun.dll {0:N0} KB" -f ((Get-Item "$rel/wintun.dll").Length / 1KB))

      - name: 构建安装器（Inno Setup）-> EchOS-Win-<版本>-x64-Setup.exe
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          # 镜像通常已自带：choco 即便命中「already installed」也要走一遍解析校验，
          # 直接判断可执行文件是否存在更省事。
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc installer/EchOS.iss "/DAPP_VERSION=$env:APP_VERSION"

      - name: 构建便携单文件（7-Zip SFX 自解压）-> Output/EchOS-Win-<版本>-x64-Portable.exe
        shell: pwsh
        run: |
          $7z = 'C:\Program Files\7-Zip\7z.exe'
          if (-not (Test-Path $7z)) { choco install 7zip -y --no-progress }
          $ver = $env:APP_VERSION
          $rel = Join-Path (Get-Location) 'build\windows\x64\runner\Release'
          # 1) 在 Release 目录内压缩 → 归档条目平铺（echos.exe 在根，SFX 才能直接运行）
          Push-Location $rel
          & $7z a -t7z -y "$env:TEMP\portable.7z" * | Out-Null
          Pop-Location
          # 2) 下载支持 Installer 配置的 SFX 模块（官方 extra 自 7-Zip 20 起不再附带 7zSD.sfx）
          Invoke-WebRequest 'https://raw.githubusercontent.com/OlegScherbakov/7zSFX/master/files/7zsd_extra_170_3900.7z' -OutFile "$env:TEMP\7zsd.7z"
          & $7z x "$env:TEMP\7zsd.7z" -o"$env:TEMP\7zsd" -y | Out-Null
          $sfx = "$env:TEMP\7zsd\7zsd_LZMA2_x64.sfx"
          # 3) 统一用 LOGO 图标替换 SFX 模块图标（Resource Hacker 只替换资源，不改可执行功能）
          #    只影响外观：拿不到工具就沿用 SFX 默认图标，不能让整个发布失败
          $rh = $null
          try {
            Invoke-WebRequest 'https://www.angusj.com/resourcehacker/resource_hacker.zip' -OutFile "$env:TEMP\reshacker.zip"
            & $7z x "$env:TEMP\reshacker.zip" -o"$env:TEMP\reshacker" -y | Out-Null
            $rh = "$env:TEMP\reshacker\ResourceHacker.exe"
          } catch {
            Write-Output 'angusj.com 下载失败，回退到 choco 安装 ResourceHacker'
          }
          if (-not ($rh -and (Test-Path $rh))) {
            choco install resourcehacker -y --no-progress
            # choco 包主程序名可能是 ResourceHacker.exe 或 ResHacker.exe，按目录扫描更稳
            $rh = @('C:\Program Files (x86)\Resource Hacker', 'C:\Program Files\Resource Hacker') |
              Where-Object { Test-Path $_ } |
              ForEach-Object { Get-ChildItem $_ -Filter '*.exe' -File -ErrorAction SilentlyContinue } |
              Where-Object { $_.Name -match 'hacker' } |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if ($rh -and (Test-Path $rh)) {
            # mask 必须是 ICONGROUP,101 而不是 MAINICON：7zSD 系列 SFX 自带的图标
            # 组 id 就是 101，用 MAINICON 只会「新增」一个组而不覆盖它，Windows 按
            # id 升序取第一个组，便携版就会继续显示 7-Zip 图标。
            & $rh -open $sfx -save $sfx -action addoverwrite -res "installer/logo.ico" -mask "ICONGROUP,101," | Out-Null
            Write-Output "已替换 SFX 图标 -> $rh"

            # 版本资源。不做这步，右键「属性 → 详细信息」显示的是 SFX 模板自带的
            # 7-Zip 信息（1.7.0.3900 / Oleg N. Scherbakov）。
            # 模板里的 LANGUAGE 必须是中性 (0,0)：SFX 原资源就在 000004b0 块里，
            # 注入成 040904b0（英文）时中文系统会回退到中性块，读到的还是 7-Zip
            # —— 实测确认过。
            $verDot = $ver.TrimStart('v')
            $verComma = ($verDot -split '\.') -join ','
            if (($verDot -split '\.').Count -lt 4) { $verComma = "$verComma,0" }
            $content = (Get-Content -LiteralPath 'installer/portable-version.rc.tpl' -Raw -Encoding UTF8) `
              -replace '@VER_DOT@', $verDot `
              -replace '@VER_COMMA@', $verComma
            # 无 BOM UTF-8：带 BOM 时 ResourceHacker 编译可能报错
            [IO.File]::WriteAllText("$env:TEMP\portable-version.rc", $content, (New-Object Text.UTF8Encoding $false))
            & $rh -open "$env:TEMP\portable-version.rc" -save "$env:TEMP\portable-version.res" -action compile | Out-Null
            & $rh -open $sfx -save $sfx -action addoverwrite -res "$env:TEMP\portable-version.res" -mask "VERSIONINFO,," | Out-Null
            Write-Output "已替换 SFX 版本资源 -> $verDot"
          } else {
            Write-Warning '未取得 ResourceHacker，便携版沿用 SFX 默认图标与版本信息（不影响功能）'
          }
          # 4) 官方规范拼接：SFX 模块 + 配置 + 归档（运行时解压到临时目录→运行 echos.exe→退出后清理，Progress=no 无解压弹窗）
          $out = Join-Path (Get-Location) "Output\EchOS-Win-$ver-x64-Portable.exe"
          $parts = @($sfx, 'installer/portable-config.txt', "$env:TEMP\portable.7z")
          $fs = [IO.File]::Create($out)
          foreach ($p in $parts) {
            $b = [IO.File]::ReadAllBytes($p)
            $fs.Write($b, 0, $b.Length)
          }
          $fs.Close()

      # 缓存只加速工具链，绝不能让产物变成「版本号看着是新的、内容还是旧的」。
      # 把以前人工做的核对固化成一步：版本串必须真的进了 Dart 产物，
      # 内核与分流数据必须在，两个包必须存在且大小正常。
      - name: 打包产物自检（防伪更新）
        shell: pwsh
        run: |
          $rel = 'build/windows/x64/runner/Release'
          $num = ''
          if ($env:APP_VERSION -match '^v?(\d+\.\d+\.\d+)$') { $num = $Matches[1] }

          if ($num -ne '') {
            # 版本串没进产物 → 客户端自报版本不对 → 自动更新静默失效
            $so = "$rel/data/app.so"
            if (-not (Test-Path $so)) { Write-Error "缺少 $so"; exit 1 }
            $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($so))
            $hit = ([regex]::Matches($text, [regex]::Escape($num))).Count
            Write-Output "app.so 中版本串 $num 出现 $hit 次"
            if ($hit -eq 0) { Write-Error "产物内没有版本串 $num —— 版本未注入"; exit 1 }
          } else {
            Write-Output "APP_VERSION='$env:APP_VERSION' 非语义化版本，跳过版本串校验"
          }

          foreach ($f in @("$rel/echos.exe", "$rel/x-tunnel.exe", "$rel/wintun.dll",
                           "$rel/geoip.dat", "$rel/geosite.dat")) {
            if (-not (Test-Path $f)) { Write-Error "缺少 $f"; exit 1 }
          }

          foreach ($f in @("Output/EchOS-Win-$env:APP_VERSION-x64-Setup.exe",
                           "Output/EchOS-Win-$env:APP_VERSION-x64-Portable.exe")) {
            if (-not (Test-Path $f)) { Write-Error "缺少 $f"; exit 1 }
            $len = (Get-Item $f).Length
            if ($len -lt 1MB) { Write-Error "$f 仅 $len 字节，明显异常"; exit 1 }
            Write-Output ("{0}  {1:N1} MB" -f $f, ($len / 1MB))
          }
          Write-Output '产物自检通过'

      # 原先这里有一个 actions/upload-artifact 步骤，已移除：
      # 成功时下面「发布 GitHub Release」已把两个安装包永久挂到 Release 上，
      # artifact 只是 2 天后就删的冗余副本；失败时又因默认 success() 根本不上传，
      # 两头都落空。去掉后可省下每版约 60MB 的 artifact 配额（免费额度 500MB）。

      - name: 发布 GitHub Release（带更新日志 + 两个安装包）
        # 推送 v* 标签 → 发布；手动触发 → 需勾选 publish_release。
        # 用 github.event.inputs 而非 inputs：push 事件下 inputs 上下文不可用。
        # 且必须显式 == 'true' —— event.inputs 取到的是字符串，'false' 同样为真值。
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event.inputs.publish_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ver = $env:APP_VERSION
          # 优先用仓库内随版本维护的更新说明 docs/releases/<tag>.md。
          # 单提交基线下 --generate-notes 只会吐一个 Full Changelog 链接，信息量太低。
          $notesFile = "docs/releases/$ver.md"
          $args = @('release', 'create', $ver,
                    "Output/EchOS-Win-$ver-x64-Setup.exe",
                    "Output/EchOS-Win-$ver-x64-Portable.exe",
                    '--title', "EchOS-Win $ver")
          if (Test-Path $notesFile) {
            Write-Output "使用更新说明：$notesFile"
            $args += @('--notes-file', $notesFile)
          } else {
            Write-Output "未找到 $notesFile，回退为自动生成的提交列表"
            $args += '--generate-notes'
          }
          gh @args

      - name: 清理历史工作流记录（最多保留 2 条）
        if: always()
        # 清理只是锦上添花：权限变动或 API 抖动都不该把已成功的发布标记为失败
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # GitHub 无原生「日志保留 N 条」；手动清理本工作流已完成（completed）的旧记录。
          # 本次运行无法删除自己，因此保留「最新的 1 条已完成 + 本次」→ 本次完成后正好 ≤2 条。
          $wfFile = ([IO.Path]::GetFileName('${{ github.workflow_ref }}'.Split('@')[0]))
          $json = gh run list --workflow $wfFile --limit 50 --json databaseId,status --jq '[.[] | select(.status == "completed") | .databaseId]'
          $ids = $json | ConvertFrom-Json
          if ($ids.Count -gt 1) {
            $drop = $ids[1..($ids.Count - 1)]
          } else {
            $drop = @()
          }
          foreach ($id in $drop) {
            Write-Output "deleting finished run $id"
            gh api -X DELETE "/repos/$env:GITHUB_REPOSITORY/actions/runs/$id" | Out-Null
          }
          Write-Output "done: 保留本次运行 + 最新完成 ($($ids.Count - $drop.Count)) 条"
